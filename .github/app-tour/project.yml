# XcodeGen spec used only by the "App tour" workflow.
# It builds the app's own sources as a regular iOS app and adds a UI-test
# target that walks through every chapter while the simulator is recorded.
name: BallotPlayTour
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  BallotPlay:
    type: application
    platform: iOS
    sources:
      - path: ../../BallotApp.swift
      - path: ../../GeneralView.swift
      - path: ../../Election.swift
      - path: ../../Color.swift
      - path: ../../State.swift
      - path: ../../Tips.swift
      - path: ../../Compass
      - path: ../../Components
      - path: ../../Guide
      - path: ../../Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: BallotPlay
        PRODUCT_BUNDLE_IDENTIFIER: dbr.BallotPlay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BallotPlay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
  BallotPlayTourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TourUITests.swift
    dependencies:
      - target: BallotPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dbr.BallotPlayTourUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BallotPlay
schemes:
  BallotPlayTour:
    build:
      targets:
        BallotPlay: all
        BallotPlayTourUITests: [test]
    test:
      config: Debug
      targets:
        - BallotPlayTourUITests
