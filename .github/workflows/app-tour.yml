name: App tour

# Builds BallotPlay for an iPad simulator, walks through every chapter with a
# UI test, and uploads the screenshots plus a screen recording as an artifact.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/app-tour/**"
      - ".github/workflows/app-tour.yml"

permissions:
  contents: write

jobs:
  tour:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Simulator to capture on; see pick_sim.py for the fallbacks.
      TOUR_DEVICE: "iPad Air 11-inch (M3)"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tag views for the UI test (CI only)
        run: bash .github/app-tour/instrument.sh

      - name: Generate Xcode project
        working-directory: .github/app-tour
        run: xcodegen generate

      - name: Boot iPad simulator
        run: |
          UDID=$(python3 .github/app-tour/pick_sim.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true

      - name: Build
        working-directory: .github/app-tour
        run: |
          xcodebuild build-for-testing \
            -project BallotPlayTour.xcodeproj -scheme BallotPlayTour \
            -destination "id=$UDID" -derivedDataPath build -quiet

      - name: Run tour and record the screen
        run: |
          OUT="$PWD/tour-output"
          mkdir -p "$OUT/screenshots" "$OUT/debug"
          python3 -c 'import time; print(time.time())' > "$OUT/debug/record_start.txt"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/tour.mov" 2> "$OUT/debug/record.log" &
          REC=$!
          sleep 3
          set +e
          TEST_RUNNER_TOUR_DIR="$OUT/screenshots" xcodebuild test-without-building \
            -project .github/app-tour/BallotPlayTour.xcodeproj -scheme BallotPlayTour \
            -destination "id=$UDID" -derivedDataPath .github/app-tour/build \
            -resultBundlePath "$OUT/Tour.xcresult"
          STATUS=$?
          sleep 2
          kill -INT "$REC"
          wait "$REC"
          ls -la "$OUT" "$OUT/screenshots"
          exit $STATUS

      - name: Export screenshots kept in the result bundle
        if: always()
        run: |
          xcrun xcresulttool export attachments --path tour-output/Tour.xcresult --output-path tour-output/attachments || true
          mkdir -p results && mv tour-output/Tour.xcresult results/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ballotplay-tour
          path: |
            tour-output/screenshots
            tour-output/debug
            tour-output/tour.mov
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: results
          retention-days: 7

      # Commits compressed copies to this branch so they can be viewed without
      # downloading the artifact. The folder is hidden, so SwiftPM ignores it.
      - name: Commit compressed media to the branch
        if: always() && github.event_name == 'push'
        run: |
          brew install ffmpeg > /dev/null
          DEST=.github/app-tour/media
          rm -rf "$DEST" && mkdir -p "$DEST/screenshots" "$DEST/debug"
          for f in tour-output/screenshots/*.png; do
            sips -s format jpeg -s formatOptions 85 --resampleWidth 1800 "$f" --out "$DEST/screenshots/$(basename "${f%.png}").jpg" > /dev/null
          done
          if [ -f tour-output/tour.mov ]; then
            # simctl records the portrait framebuffer: rotate the landscape tour upright and trim it to the test run.
            RANGE=$(python3 -c 'import sys; s=float(open(sys.argv[1]).read()); t=dict((l.rstrip("\n").split("\t")[1], float(l.split("\t")[0])) for l in open(sys.argv[2])); print("%.2f %.2f" % (max(0, t["launch"]-s-2.4), t["end"]-s+0.8))' \
              tour-output/debug/record_start.txt tour-output/debug/timeline.tsv)
            set -- $RANGE
            ffmpeg -hide_banner -y -loglevel error -i tour-output/tour.mov -ss "$1" -to "$2" \
              -vf "transpose=2,scale=trunc(iw/4)*2:-2,fps=30,format=yuv420p" \
              -c:v libx264 -preset slow -crf 22 -tune stillimage -movflags +faststart -an "$DEST/tour.mp4"
          fi
          cp -R tour-output/debug/. "$DEST/debug/" || true
          du -sh "$DEST" "$DEST"/*
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Update app tour media [skip ci]" -m "From run ${{ github.run_id }}"
          git push origin "HEAD:${{ github.ref_name }}"
