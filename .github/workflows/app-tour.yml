name: App tour

# Builds BallotPlay for an iPad simulator and walks through every chapter with a
# UI test: once in light mode (every screenshot also taken in dark), then once in
# dark mode for a dark recording. Uploads screenshots and recordings as an artifact.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/app-tour/**"
      - ".github/workflows/app-tour.yml"

permissions:
  contents: write

jobs:
  tour:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Simulator to capture on; see pick_sim.py for the fallbacks.
      TOUR_DEVICE: "iPad Air 11-inch (M3)"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tag views for the UI test (CI only)
        run: bash .github/app-tour/instrument.sh

      - name: Generate Xcode project
        working-directory: .github/app-tour
        run: xcodegen generate

      - name: Boot iPad simulator
        run: |
          UDID=$(python3 .github/app-tour/pick_sim.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true

      - name: Build
        working-directory: .github/app-tour
        run: |
          xcodebuild build-for-testing \
            -project BallotPlayTour.xcodeproj -scheme BallotPlayTour \
            -destination "id=$UDID" -derivedDataPath build -quiet

      - name: Tour in light mode, with a dark twin of every screenshot
        run: bash .github/app-tour/run_tour.sh "$PWD/tour-output/light" light 1

      - name: Tour in dark mode, for the dark recording
        if: always()
        run: bash .github/app-tour/run_tour.sh "$PWD/tour-output/dark" dark 0

      - name: Collect result bundles
        if: always()
        run: |
          mkdir -p results
          for pass in light dark; do
            [ -d "tour-output/$pass/Tour.xcresult" ] || continue
            xcrun xcresulttool export attachments --path "tour-output/$pass/Tour.xcresult" --output-path "tour-output/$pass/attachments" || true
            mv "tour-output/$pass/Tour.xcresult" "results/$pass.xcresult"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ballotplay-tour
          path: tour-output
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: results
          retention-days: 7

      # Commits compressed copies to this branch so they can be viewed without
      # downloading the artifact. The folder is hidden, so SwiftPM ignores it.
      - name: Commit compressed media to the branch
        if: always() && github.event_name == 'push'
        run: |
          brew install ffmpeg > /dev/null
          DEST=.github/app-tour/media
          rm -rf "$DEST" && mkdir -p "$DEST/screenshots" "$DEST/debug/light" "$DEST/debug/dark"
          for f in tour-output/light/screenshots/*.png; do
            sips -s format jpeg -s formatOptions 85 --resampleWidth 1800 "$f" --out "$DEST/screenshots/$(basename "${f%.png}").jpg" > /dev/null
          done
          # simctl records the portrait framebuffer; make_video.py rotates, trims and (for light) cuts out the dark twins.
          if [ -f tour-output/light/tour.mov ]; then
            python3 .github/app-tour/make_video.py tour-output/light "$DEST/tour.mp4" --cut-dark
          fi
          if [ -f tour-output/dark/tour.mov ]; then
            python3 .github/app-tour/make_video.py tour-output/dark "$DEST/tour-dark.mp4"
          fi
          cp -R tour-output/light/debug/. "$DEST/debug/light/" || true
          cp -R tour-output/dark/debug/. "$DEST/debug/dark/" || true
          du -sh "$DEST" "$DEST"/*
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Update app tour media [skip ci]" -m "From run ${{ github.run_id }}"
          git push origin "HEAD:${{ github.ref_name }}"
